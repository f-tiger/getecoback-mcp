# Test the package and its reviewed examples locally on each change. Daily and
# manual runs additionally verify the exact hosted version and all examples.
name: Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify local stdio and every reviewed example
        run: npm run test:local
      - name: Verify live hosted parity
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run test:hosted

  # Glama builds the image and checks the server starts and answers an
  # introspection request. That check now runs here too, so a broken container
  # fails on our side instead of silently dropping the directory listing.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t getecoback-mcp:ci .
      - name: Introspect exactly as a directory would
        run: |
          out=$(printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | docker run -i --rm getecoback-mcp:ci)
          jq -se '
            any(.[]; .id == 1 and (.result.serverInfo.name | type == "string" and length > 0))
          ' <<< "$out" > /dev/null || { echo "::error::invalid initialize response"; exit 1; }
          jq -se '
            map(select(.id == 2)) | first | .result.tools | map(.name) |
            length == 100 and (unique | length == 100) and
            all(.[]; type == "string" and length > 0) and
            (index("entfeuchter_ablaufcheck") != null)
          ' <<< "$out" > /dev/null || { echo "::error::expected 100 unique tools including entfeuchter_ablaufcheck"; exit 1; }
          echo "OK container introspection"
